# Interactive prompts
[prompt]
search_placeholder_text = "(Type to search)"
more_choices_text = "(Move up and down to reveal more choices)"

generate_new_config = "New config will be generated..."

welcome = "Welcome to [gold1]Stellaris Tech Relation Generator[/]!"
read_instructions = "Make sure to [cyan]read instructions[/] carefully!"
pause = "Press [cyan]Enter[/] to continue..."

ask_game_path = "[white]What is your [cyan]game path[/]?[/]"
ask_document_path = "[white]What is your [cyan]document path[/]?[/]"
config_created = "[green]Config successfully created![/]"

close_launcher = "Please [cyan]close the launcher[/] before continuing"
# {1} = output path — {0} (playset name) intentionally unused
confirm_use_saved_vanilla = "Use [yellow]vanilla game[/] with output path [yellow]{1}[/]?"
