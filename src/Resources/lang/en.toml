loading_l10n = "Loading localization"
generating_l10n = "Generating localization"
writing_l10n_fragments = "Writing l10n fragments"
writing_l10n = "Writing localization"


# Data processing warnings
[data]
# {0} = tech key
tech_no_category = "Tech {0} has no category"
# {0} = tech key
l10n_entry_not_found = "Localization entry of {0} not found"
# {0} = tech key, {1} = swap key
l10n_entry_and_swap_not_found = "Localization entry of {0} and swap {1} not found"
# {0} = tech key, {1} = unknown prereq key
tech_unknown_prereq = "Tech {0} has unknown prereq: {1}"
# {0} = tech key
tech_unnamed_swap = "[red]Tech {0} has an unnamed swap, skipping it[/]"
# {0} = loc key with circular reference
l10n_cycle_reference = "Circular reference in loc key \"{0}\", skipping resolution to prevent infinite loop"




# Error messages
[error]
config_parse_failed = "[red]Failed to parse config: [/]"
playset_not_found = "Playset not found!"
target_mod_not_found = "Target mod not found!"
multiple_mods_same_name = "Multiple mods with same name detected"
# {0} = output directory path
failed_to_access_output_dir = "Failed to access output directory: {0}"
