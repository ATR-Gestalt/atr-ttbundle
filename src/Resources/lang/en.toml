confirm_use_saved_target = "Use saved playset [yellow]{0}[/] with target mod [yellow]{1}[/]?"
choose_playset = "Choose the desired playset (Press [cyan]Esc[/] to use vanilla game)"
current_playset_prefix = "[green](Current)[/] "
ask_output_path = "What is the output path for generated files?"
choose_target_mod = "Choose the target mod to output generated files to"
target_mod_collision_header = "These mods are located at:"
# {0} = mod file path
target_mod_collision_item = "  - {0}"
# {1} = output path — {0} (playset name) intentionally unused
confirm_save_vanilla = "Save selection? ([yellow]Vanilla game[/], output path: [yellow]{1}[/])"
# {0} = playset name, {1} = target mod name
confirm_save_target = "Save selection? (Playset: [yellow]{0}[/], target mod: [yellow]{1}[/])"

# {0} = file count, {1} = output directory
saved_l10n = "Written [cyan]{0}[/] localization files to [grey underline]{1}[/]"
# {0} = relation count, {1} = tech count
generation_summary = "[green]Successfully generated [cyan]{0}[/] relation entries for [cyan]{1}[/] techs![/]"


# Progress bar task descriptions
[progress]
connecting_launcher_db = "Connecting to launcher database"
